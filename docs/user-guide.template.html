<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TypeText User Guide - {{VERSION}}</title>
<style>
:root{--navy:#101d36;--navy2:#19345e;--blue:#3478c7;--aqua:#58c8ce;--ink:#1b2738;--wash:#f3f7fb;--line:#dbe4ef;--shadow:0 24px 80px #0f1f3824}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);font:16px/1.7 Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eaf0f6}a{color:inherit}
.shell{width:min(1080px,calc(100% - 40px));margin:28px auto 72px;background:#fff;box-shadow:var(--shadow);border-radius:20px;overflow:hidden}
.cover{min-height:680px;position:relative;overflow:hidden;color:#fff;padding:72px 76px;background:linear-gradient(145deg,var(--navy),#14284a 58%,#1d4c75);display:flex;flex-direction:column;justify-content:space-between}
.cover:before{content:"";position:absolute;width:520px;height:520px;border:1px solid #ffffff1f;border-radius:50%;right:-145px;top:-180px;box-shadow:0 0 0 70px #58c8ce0b,0 0 0 140px #3478c70a}.cover:after{content:"T";position:absolute;right:55px;bottom:-155px;font:800 530px/1 Georgia,serif;color:#ffffff09;transform:rotate(-7deg)}
.brand,.cover-copy,.cover-foot{position:relative;z-index:1}.brand{display:flex;align-items:center;gap:13px;font-weight:750}.brand-mark{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;color:var(--navy);font:900 26px/1 Georgia,serif;background:linear-gradient(145deg,#fff,#b9f1ee);box-shadow:0 10px 30px #0003}
.eyebrow,.section-kicker{margin:0;text-transform:uppercase;letter-spacing:.18em;font-size:.72rem;font-weight:800}.eyebrow{color:#9ce4e1}h1{max-width:690px;margin:16px 0 0;font-size:clamp(3.3rem,7vw,5.7rem);line-height:.93;letter-spacing:-.055em}.cover-copy>p:last-child{max-width:630px;margin:26px 0 0;font-size:1.14rem;color:#d7e3f2}
.cover-foot{display:flex;align-items:end;justify-content:space-between;border-top:1px solid #ffffff2e;padding-top:22px;color:#c3d2e5;font-size:.82rem}.version{display:inline-flex;align-items:center;gap:8px;border:1px solid #ffffff3d;background:#ffffff14;padding:7px 12px;border-radius:999px;color:#fff;font-weight:700}.version:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--aqua);box-shadow:0 0 0 4px #58c8ce26}
.contents{padding:68px 76px 74px;background:linear-gradient(180deg,#fff,var(--wash))}.section-kicker{color:var(--blue)}.contents h2{margin:5px 0 28px;font-size:2.25rem;line-height:1.15}.toc{display:grid;grid-template-columns:1fr 1fr;gap:10px}.toc a{display:grid;grid-template-columns:36px 1fr 20px;align-items:center;gap:10px;text-decoration:none;padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:#fff}.toc a:hover{border-color:#8fb9e7;transform:translateY(-1px);box-shadow:0 8px 24px #224b7814}.toc span{font:800 .72rem/1 monospace;color:var(--blue)}.toc strong{font-size:.87rem;line-height:1.25}.toc b{color:#8a9aae}.edition-note{margin-top:28px;padding:18px 20px;border-radius:12px;background:#e8f7f7;color:#244b58;border:1px solid #c6e9e9;font-size:.91rem}
.chapter{padding:68px 76px;border-top:1px solid var(--line);scroll-margin-top:24px}.chapter:nth-of-type(even){background:#fbfcfe}.chapter-head{display:flex;align-items:center;gap:20px;margin-bottom:30px}.chapter-number{flex:0 0 64px;height:64px;display:grid;place-items:center;border-radius:18px;background:linear-gradient(145deg,var(--navy2),var(--blue));color:#fff;font:800 1.12rem/1 monospace;box-shadow:0 12px 24px #24548938}.chapter-label{margin:0;color:var(--blue);font-size:.7rem;font-weight:800;letter-spacing:.15em;text-transform:uppercase}.chapter-head h2{margin:3px 0 0;font-size:2rem;line-height:1.1;color:var(--navy)}.chapter-body{max-width:820px;margin-left:84px}.chapter-body>p{margin:.4rem 0 1rem}
h3{margin:2rem 0 .6rem;color:var(--navy2);font-size:1.12rem}h3:before{content:"";display:inline-block;width:18px;height:3px;margin:0 9px 4px 0;border-radius:2px;background:var(--aqua)}code{font:600 .88em/1.4 Consolas,monospace;color:#174d80;background:#edf4fb;border:1px solid #d7e7f6;padding:.12rem .38rem;border-radius:5px}
.guide-list{padding-left:0;margin:.7rem 0 1.3rem;list-style:none;counter-reset:item}.guide-list li{position:relative;display:grid;grid-template-columns:24px 1fr;gap:9px;margin:.52rem 0}ul.guide-list li:before{content:"";width:7px;height:7px;margin:9px 0 0 7px;border-radius:50%;background:var(--aqua);box-shadow:0 0 0 4px #e5f7f7}ol.guide-list li:before{counter-increment:item;content:counter(item);width:24px;height:24px;display:grid;place-items:center;border-radius:7px;background:#e8f1fb;color:var(--blue);font:800 .72rem/1 monospace}
.callout{display:grid;grid-template-columns:32px 1fr;gap:12px;margin:1.5rem 0;padding:16px 18px;border:1px solid #c8e6e7;border-radius:12px;background:linear-gradient(135deg,#edfafa,#f6fbff);color:#294a58}.callout-icon{width:26px;height:26px;display:grid;place-items:center;border-radius:50%;background:var(--aqua);color:#103847;font:900 .85rem/1 Georgia,serif}
.table-wrap{margin:1.5rem 0;overflow:hidden;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;font-size:.82rem;line-height:1.4}th{background:var(--navy2);color:#fff;font-size:.71rem}th,td{padding:12px 11px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}tr:last-child td{border-bottom:0}tbody tr:nth-child(even){background:var(--wash)}td:not(:first-child){text-align:center}.end-mark{text-align:center;margin-top:45px;color:#8ca0b8}.print-footer{display:none}
@page{size:A4;margin:20mm 18mm 24mm}@page cover{size:A4;margin:0}@media(max-width:720px){.shell{width:100%;margin:0;border-radius:0}.cover,.contents,.chapter{padding:42px 25px}.cover{min-height:610px}.toc{grid-template-columns:1fr}.chapter-body{margin-left:0}.chapter-number{flex-basis:52px;height:52px}}
@media print{body{background:#fff;font-size:9.7pt;line-height:1.5}.shell{width:auto;margin:0;box-shadow:none;border-radius:0;overflow:visible}.cover{page:cover;width:210mm;height:297mm;min-height:0;margin:0;padding:25mm 20mm 21mm;break-after:page;print-color-adjust:exact}.cover:after{font-size:125mm;bottom:-34mm}h1{font-size:45pt}.contents{min-height:253mm;padding:7mm 1mm 4mm;background:#fff;break-after:page}.contents h2{margin-bottom:5mm}.toc{gap:2mm}.toc a{padding:2.6mm;break-inside:avoid}.edition-note{margin-top:5mm;padding:3.5mm 4mm}.chapter{padding:9mm 0 4mm}.chapter:nth-of-type(even){background:#fff}.chapter-head{margin-bottom:6mm;break-after:avoid}.chapter-number{flex-basis:14mm;height:14mm;border-radius:4mm;box-shadow:none}.chapter-head h2{font-size:19pt}.chapter-body{max-width:none;margin-left:18mm;padding-bottom:2mm}h3{break-after:avoid;margin-top:5mm}p,li{orphans:3;widows:3}.callout,.table-wrap,.guide-list li{break-inside:avoid}.print-footer{display:none}}
</style>
</head>
<body>
<script id="guide-source" type="text/plain">
{{GUIDE_SOURCE}}
</script>
<main class="shell" id="guide"></main>
<script>
const source=document.getElementById("guide-source").textContent;
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const inline=s=>esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
const lines=source.split(/\r?\n/),blocks=[];let i=0;
while(i<lines.length){let line=lines[i].trimEnd();if(!line){i++;continue}
let h=line.match(/^(#{1,3}) (.+)$/);if(h){blocks.push(["h"+h[1].length,h[2]]);i++;continue}
if(line==="---"){blocks.push(["rule",""]);i++;continue}
if(line.startsWith("> ")){blocks.push(["note",line.slice(2)]);i++;continue}
if(line.startsWith("| ")){let rows=[];while(i<lines.length&&lines[i].startsWith("| ")){let cells=lines[i].trim().replace(/^\||\|$/g,"").split("|").map(x=>x.trim());if(!cells.every(x=>/^-+$/.test(x)))rows.push(cells);i++}blocks.push(["table",rows]);continue}
if(/^[-*] /.test(line)){let a=[];while(i<lines.length&&/^[-*] /.test(lines[i]))a.push(lines[i++].slice(2).trim());blocks.push(["ul",a]);continue}
if(/^\d+\. /.test(line)){let a=[];while(i<lines.length&&/^\d+\. /.test(lines[i]))a.push(lines[i++].replace(/^\d+\. /,"").trim());blocks.push(["ol",a]);continue}
let p=[line];i++;while(i<lines.length&&lines[i].trim()&&!/^(#{1,3}) |^[-*] |^\d+\. |^> |^\| |^---$/.test(lines[i]))p.push(lines[i++].trimEnd());blocks.push(["p",p.join(" ")])}
const intro=blocks.slice(2).find(x=>x[0]==="p")?.[1]||"",note=blocks.find(x=>x[0]==="note")?.[1]||"";
const chapters=[];let current=null;for(const b of blocks){if(b[0]==="h2"){current={title:b[1],id:b[1].toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""),blocks:[]};chapters.push(current)}else if(current)current.blocks.push(b)}
const render=([k,v])=>k==="h3"?`<h3>${inline(v)}</h3>`:k==="p"?`<p>${inline(v)}</p>`:k==="note"?`<aside class="callout"><span class="callout-icon">i</span><div>${inline(v)}</div></aside>`:(k==="ul"||k==="ol")?`<${k} class="guide-list">${v.map(x=>`<li><span>${inline(x)}</span></li>`).join("")}</${k}>`:k==="table"?`<div class="table-wrap"><table><thead><tr>${v[0].map(x=>`<th>${inline(x)}</th>`).join("")}</tr></thead><tbody>${v.slice(1).map(r=>`<tr>${r.map(x=>`<td>${inline(x)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`:k==="rule"?`<div class="end-mark">- TT -</div>`:"";
const toc=chapters.map((c,n)=>`<a href="#${c.id}"><span>${String(n+1).padStart(2,"0")}</span><strong>${inline(c.title)}</strong><b>&rsaquo;</b></a>`).join("");
const content=chapters.map((c,n)=>`<section class="chapter" id="${c.id}"><header class="chapter-head"><span class="chapter-number">${String(n+1).padStart(2,"0")}</span><div><p class="chapter-label">Chapter ${n+1}</p><h2>${inline(c.title)}</h2></div></header><div class="chapter-body">${c.blocks.map(render).join("")}</div></section>`).join("");
document.getElementById("guide").innerHTML=`<section class="cover"><div class="brand"><span class="brand-mark">T</span><span>TypeText</span></div><div class="cover-copy"><p class="eyebrow">Official product documentation</p><h1>TypeText<br>User Guide</h1><p>${inline(intro)}</p></div><div class="cover-foot"><span class="version">{{VERSION}}</span><span>Reusable text. Ready when you are.</span></div></section><section class="contents"><p class="section-kicker">Navigate the guide</p><h2>Contents</h2><nav class="toc">${toc}</nav><div class="edition-note">${inline(note)}</div></section>${content}<footer class="print-footer"><span>TypeText User Guide - {{VERSION}}</span><span>Page <b class="page-number"></b></span></footer>`;
</script>
</body>
</html>
